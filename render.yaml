services:
  - type: static
    name: neodesk-frontend-prod-77
    rootDir: nbu-nurse-assistant
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://neodesk-backend-prod-77.onrender.com/api

  - type: web
    name: neodesk-backend-prod-77
    env: php
    plan: free
    rootDir: nbu-laravel-unified
    buildCommand: touch database/database.sqlite && composer install --no-dev --no-interaction --prefer-dist && php artisan migrate --force && php artisan config:cache && php artisan route:cache
    envVars:
      - key: APP_KEY
        value: "base64:uP3vUqZ6Q5qZ6Q5qZ6Q5qZ6Q5qZ6Q5qZ6Q5qZ6Q5qZ6="
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: database/database.sqlite
      - key: LOG_CHANNEL
        value: stderr
