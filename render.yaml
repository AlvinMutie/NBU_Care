services:
  - type: web
    name: neodesk-frontend-final
    env: static
    buildCommand: cd nbu-nurse-assistant && npm install && npm run build
    staticPublishPath: nbu-nurse-assistant/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://neodesk-backend-final.onrender.com/api

  - type: web
    name: neodesk-backend-final
    env: php
    plan: free
    buildCommand: cd nbu-laravel-unified && composer install --no-dev --no-interaction --prefer-dist && touch database/database.sqlite && php artisan migrate --force
    startCommand: cd nbu-laravel-unified && php artisan serve --host=0.0.0.0 --port=$PORT
    envVars:
      - key: APP_KEY
        value: "base64:Ym9sdG9uaXNoZXJlYW5kd2VsbG9mY291cnNlaGVsbG8xMg=="
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: database/database.sqlite
      - key: LOG_CHANNEL
        value: stderr
