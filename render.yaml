services:
  - type: web
    name: neodesk-front-v130
    env: static
    rootDir: nbu-nurse-assistant
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://neodesk-back-v130.onrender.com/api

  - type: web
    name: neodesk-back-v130
    env: php
    plan: free
    rootDir: nbu-laravel-unified
    buildCommand: composer install --no-dev --no-interaction --prefer-dist && touch database/database.sqlite && php artisan migrate --force
    startCommand: php artisan serve --host=0.0.0.0 --port=$PORT
    envVars:
      - key: APP_KEY
        value: "base64:Ym9sdG9uaXNoZXJlYW5kd2VsbG9mY291cnNlaGVsbG8xMg=="
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: database/database.sqlite
      - key: LOG_CHANNEL
        value: stderr
