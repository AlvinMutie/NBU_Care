services:
  # Laravel Backend & Unified Frontend (Docker)
  - type: web
    name: nbu-laravel-unified
    runtime: docker
    plan: free
    rootDir: nbu-laravel-unified
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: true
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: nbu-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: nbu-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: nbu-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: nbu-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: nbu-db
          property: password

databases:
  - name: nbu-db
    plan: free
    databaseName: nbucare
    user: nbuadmin
