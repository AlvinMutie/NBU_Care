services:
  - type: web
    name: neodesk-front-v301
    env: static
    buildCommand: cd nbu-nurse-assistant && npm install && npm run build
    staticPublishPath: nbu-nurse-assistant/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://neodesk-back-v301.onrender.com/api

  - type: web
    name: neodesk-back-v301
    env: docker
    plan: free
    rootDir: nbu-laravel-unified
    dockerfilePath: Dockerfile
    envVars:
      - key: APP_KEY
        value: "base64:Ym9sdG9uaXNoZXJlYW5kd2VsbG9mY291cnNlaGVsbG8xMg=="
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: database/database.sqlite
      - key: LOG_CHANNEL
        value: stderr
