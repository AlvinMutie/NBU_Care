name: Neonatal Care Unified CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # --- JOB 1: BACKEND VERIFICATION ---
  laravel-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./nbu-laravel-unified

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup PHP Environment
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        extensions: mbstring, xml, ctype, iconv, mysql, zip
        coverage: none

    - name: Copy Environment File
      run: php -r "file_exists('.env') || copy('.env.example', '.env');"

    - name: Install Composer Dependencies
      run: composer install --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist --ignore-platform-reqs

    # We inject standard environment overrides directly into the execution run
    - name: Clear Cached Configuration
      run: php artisan optimize:clear
      env:
        DB_CONNECTION: sqlite
        DB_DATABASE: ":memory:"
        CACHE_STORE: array

    - name: Generate Application Key
      run: php artisan key:generate
      env:
        DB_CONNECTION: sqlite
        DB_DATABASE: ":memory:"

    - name: Run PHP Syntax Check (Linting)
      run: find app/ -type f -name "*.php" -exec php -l {} \;

  # --- JOB 2: FRONTEND VERIFICATION ---
  react-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./nbu-nurse-assistant

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js Environment
      uses: actions/setup-node@v4
      with:
        node-version: '20' 
        cache: 'npm'
        cache-dependency-path: ./nbu-nurse-assistant/package-lock.json

    - name: Install Node Dependencies
      run: npm ci

    - name: Verify Production Compilation
      run: npm run build